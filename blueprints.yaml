name: Intention Base
slug: intention-base
type: theme
version: 0.2.0
description: Standalone Grav 2 theme for Intention
icon: paint-brush
author:
  name: Intention
  email: hello@byintention.co
homepage: https://byintention.co
keywords: intention, theme, custom
license: MIT
compatibility:
  grav: ['2.0']
dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: loose
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        global:
          type: tab
          title: Global Settings
          fields:
            contact_section:
              type: section
              title: Contact Information
              underline: true

            phone:
              type: text
              label: Phone
              help: Primary contact phone number.

            email:
              type: email
              label: Email
              help: Primary contact email address.

            company_name:
              type: text
              label: Business name
              help: LocalBusiness schema name shown in the footer.

            street_address:
              type: text
              label: Street address

            address_locality:
              type: text
              label: Town / city

            address_region:
              type: text
              label: County / region

            postal_code:
              type: text
              label: Postcode

            google_rating:
              type: text
              label: Google rating
              help: Aggregate star rating shown in the footer schema (e.g. 5).

            google_review_count:
              type: number
              label: Google review count
              help: Number of Google reviews in the footer schema.

            social_section:
              type: section
              title: Social Media
              underline: true

            social.bluesky:
              type: url
              label: Bluesky
              help: Full URL to your Bluesky profile.

            social.mastodon:
              type: url
              label: Mastodon
              help: Full URL to your Mastodon profile.

            social.linkedin:
              type: url
              label: LinkedIn
              help: Full URL to your LinkedIn profile or company page.

            social.instagram:
              type: url
              label: Instagram
              help: Full URL to your Instagram profile.

            social.facebook:
              type: url
              label: Facebook
              help: Full URL to your Facebook page or profile.

            social.twitter:
              type: url
              label: Twitter / X
              help: Full URL to your Twitter/X profile.

            notices_section:
              type: section
              title: Notices & popups
              underline: true

            entry_popup_text:
              type: moderneditor
              label: Entry popup text
              help: Shown in the site entry / HCP gate popup.
              markdown_enabled: false
              xss_check: false
              height: 220
              menubar: false

            external_link_popup_text:
              type: moderneditor
              label: External link popup text
              help: Shown when a visitor follows an external link.
              markdown_enabled: false
              xss_check: false
              height: 220
              menubar: false

            adverse_event_text:
              type: moderneditor
              label: Adverse event text
              help: Adverse event reporting copy in the site footer.
              markdown_enabled: false
              xss_check: false
              height: 220
              menubar: false

            appearance_section:
              type: section
              title: Appearance
              underline: true

            theme-mode:
              type: select
              label: Theme Mode Default
              help: Default appearance before a user makes a choice. Users can still toggle in the header.
              size: small
              default: auto
              options:
                auto: Auto (follows OS)
                light: Light
                dark: Dark

            og_image:
              type: file
              label: Default share image
              help: PNG, JPEG, or WebP used for Open Graph when a page has no featured or hero image. Saved to user/themes/intention-base/images/og.
              destination: 'theme://images/og'
              multiple: false
              accept:
                - image/png
                - image/jpeg
                - image/webp

            colours_section:
              type: section
              title: Colours
              underline: true

            colours:
              type: list
              label: Colours
              help: Named brand colours for use across the site.
              style: vertical
              fields:
                .label:
                  type: text
                  label: Label
                .colour:
                  type: colorpicker
                  label: Colour
