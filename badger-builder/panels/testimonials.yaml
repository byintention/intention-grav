schema: 1
id: testimonials
label: Testimonials
modified: 0
twig: testimonials
fields:
  - name: testimonials_heading
    type: text
    label: Heading
    help: 'Optional heading above the quote(s)'
  - name: testimonials_mode
    type: select
    label: Display
    default: random
    width: half
