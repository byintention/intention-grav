schema: 1
id: text
label: Text + image
modified: 0
twig: text
fields:
  - name: text_body
    type: markdown
    label: Body
    help: 'Markdown and inline HTML supported.'
    width: half
  - name: text_image
    type: site_media
    label: Image
    help: "Pick or upload from the site media library. Alt text is set in the picker."
    width: half
  - name: text_image_caption
    type: text
    label: Caption
    help: 'Shown under the image.'
  - name: text_overall_classes
    type: text
    label: Overall classes
    help: 'Extra CSS classes on the outer section element.'
    width: third
  - name: text_background
    type: select
    label: Background colour
    default: transparent
    width: third
    options:
      transparent: Transparent
  - name: text_align
    type: select
    label: Textbox position
    default: right
    width: third
    options:
      left: left
      right: right
