schema: 1
id: faq
label: FAQ
modified: 0
twig: faq
fields:
  - name: faq
    type: list
    label: Items
    fields:
      - name: title
        type: text
        label: Title
      - name: content
        type: markdown
        label: Content
        help: 'Markdown and inline HTML supported.'
  - name: faq_background
    type: select
    label: Background colour
    default: transparent
    options:
      transparent: Transparent
    width: half
  - name: faq_width
    type: range
    label: Container width
    default: 100
    min: 25
    max: 100
    step: 1
    unit: '%'
    width: half
    help: 'Width of the inner content area as a percentage of the container'
